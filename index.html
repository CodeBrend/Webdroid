<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Webdroid</title>
<style>
:root{--page:#e9e6df;--ink:#1d2327;--glass:rgba(255,255,255,.2);--app:#f7f5f0;--appink:#1d2327;--line:#d9d5cb;--accent:#0f8b8d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14181b;--ink:#e8e6e1}}
:root[data-theme="dark"]{--page:#14181b;--ink:#e8e6e1}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:min(390px,100%);height:min(800px,100%);border-radius:44px;overflow:hidden;background:#1b3a4b;box-shadow:0 0 0 10px #0d0f10,0 24px 60px rgba(0,0,0,.35);color:#fff;user-select:none;touch-action:none}
.phone.dark{--app:#171c1f;--appink:#ecebe6;--line:#2b3236}
button,input{font:inherit}
.status{position:absolute;top:0;left:0;right:0;height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:700;z-index:60;pointer-events:none}
.home{position:absolute;inset:0;padding:58px 18px 0;overflow:hidden}
.clockbig{font-size:60px;font-weight:300;letter-spacing:-2px;line-height:1;padding-left:4px}
.datebig{font-size:14px;opacity:.9;margin:6px 0 22px 4px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 4px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:inherit;font-size:11px;cursor:pointer;min-width:0}
.ic i{width:var(--isz,56px);height:var(--isz,56px);border-radius:18px;display:grid;place-items:center;box-shadow:0 5px 12px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.18);transition:transform calc(.15s*var(--spd,1))}
.ic i svg{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.ip-glass .ic i{background:rgba(255,255,255,.2)!important;border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px)}
.ip-line .ic i{background:rgba(15,18,20,.55)!important;box-shadow:none;border:2px solid var(--c)}.ip-line .ic i svg{stroke:var(--c);filter:none}
.ic:active i{transform:scale(.9)}
.ic span{text-shadow:0 1px 3px rgba(0,0,0,.5);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nolab .ic span{display:none}.nolab .dockw .ic span{display:none}
.sh-round .ic i{border-radius:50%}.sh-sq .ic i{border-radius:10px}
.pill{position:absolute;left:14px;right:14px;bottom:148px;height:48px;border-radius:24px;background:rgba(246,246,246,.93);display:flex;align-items:center;gap:10px;padding:0 8px 0 8px;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pill b{width:32px;height:32px;border-radius:50%;background:#fc3f1d;color:#fff;display:grid;place-items:center;font-size:16px}
.pill input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:14px;color:#222}
.dock{position:absolute;left:14px;right:14px;bottom:62px;height:76px;border-radius:28px;background:var(--glass);backdrop-filter:blur(14px);display:flex;justify-content:space-around;align-items:center}
.nav{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;justify-content:center;gap:56px;align-items:center;z-index:40;color:#fff}
.nav.onapp{color:var(--appink)}
.nav button{background:none;border:0;color:inherit;cursor:pointer;padding:8px 14px;display:grid;place-items:center}
.nav.g button{display:none}
.nav.g::before{content:"";width:120px;height:4px;border-radius:2px;background:currentColor;opacity:.75}
.win{position:absolute;inset:0;background:var(--app);color:var(--appink);z-index:20;display:flex;flex-direction:column;padding-top:38px;padding-bottom:48px;transform:scale(.25);opacity:0;border-radius:40px;pointer-events:none;transition:transform calc(.3s*var(--spd,1)) cubic-bezier(.2,.8,.2,1),opacity calc(.2s*var(--spd,1)),border-radius calc(.3s*var(--spd,1))}
.win.open{transform:none;opacity:1;border-radius:0;pointer-events:auto}
.win h2{font-size:22px;padding:10px 20px 12px;font-weight:700}
.body{flex:1;overflow:auto;padding:0 20px 16px;touch-action:pan-y}
.body.flush{padding:0;display:flex;flex-direction:column}
textarea{width:100%;height:100%;resize:none;border:0;background:transparent;color:inherit;font-size:17px;line-height:1.5;outline:0}
.bar{display:flex;gap:8px;padding:0 12px 10px}
.bar input,.field{flex:1;min-width:0;height:40px;border-radius:20px;border:1px solid var(--line);background:transparent;color:inherit;padding:0 14px;outline:0}
.frame{flex:1;position:relative;overflow:auto}.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.hint{padding:20px;opacity:.7;font-size:14px;line-height:1.5}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;font-size:12px;border-top:1px solid var(--line)}
.sites{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 16px}
.sites button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:16px;padding:14px 4px;cursor:pointer;font-size:13px}
.calc{display:flex;flex-direction:column;height:100%}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:10px 4px;gap:4px}
.disp small{opacity:.55;font-size:16px;min-height:20px}.disp b{font-size:52px;font-weight:300;word-break:break-all;text-align:right}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.keys button{height:58px;border-radius:20px;border:1px solid var(--line);background:transparent;color:inherit;font-size:22px;cursor:pointer}
.keys .op{background:var(--accent);border-color:var(--accent);color:#fff}.keys .fn{opacity:.7}
.big{font-size:58px;font-weight:300;text-align:center;padding:30px 0 6px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:inherit;padding:9px 16px;border-radius:14px;cursor:pointer}
.btn.pri,.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;border:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(20px)}
.dots{display:flex;gap:8px;flex-wrap:wrap}.dots button{width:36px;height:36px;border-radius:12px;border:2px solid transparent;cursor:pointer}
.dots button.sel{border-color:var(--appink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
input[type=range]{accent-color:var(--accent);width:140px}
.store .row{flex-wrap:nowrap}.store small{opacity:.6;display:block}
.store .ic i{width:44px;height:44px;border-radius:14px}
.mod{margin:14px 0 2px;font-weight:700}.mod small{display:block;font-weight:400;opacity:.6}
#lock{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.3);backdrop-filter:blur(26px);display:flex;flex-direction:column;align-items:center;padding-top:80px;transition:transform calc(.35s*var(--spd,1)) ease}
#lock.off{transform:translateY(-105%)}
#lock .t{font-size:84px;font-weight:200;line-height:1}#lock .d{margin-top:8px;font-size:16px}#lock .o{font-size:13px;opacity:.8;margin-top:4px}
#ln{width:calc(100% - 28px);margin-top:22px;overflow:hidden}
#fp{margin-top:auto;margin-bottom:34px;background:none;border:0;color:#fff;cursor:pointer;opacity:.9}
#pad{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;padding-top:120px;gap:18px}
#pad.open{display:flex}
#pd{font-size:22px;letter-spacing:6px;height:36px}
#pk{display:grid;grid-template-columns:repeat(3,70px);gap:12px}
#pk button{height:60px;border-radius:30px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
#shade{position:absolute;inset:0;z-index:58;background:rgba(0,0,0,.42);transform:translateY(-105%);transition:transform calc(.28s*var(--spd,1)) ease;display:flex;flex-direction:column}
#shade.open{transform:none}
.qp{background:#1c2124;border-radius:0 0 26px 26px;padding:44px 16px 8px;color:#fff}
.qh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;opacity:.9}
.tiles{display:flex;justify-content:space-between;gap:8px}
.tw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;text-align:center;width:58px}
.tile{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
.tile.on{background:var(--accent)}.tq .tile{border-radius:16px}
.tw span{display:none}
#shade:not(.ex) .tw:nth-child(n+6){display:none}
#shade.ex .tiles{display:grid;gap:16px 8px;justify-items:center}
#shade.ex .tw{width:auto}#shade.ex .tw span{display:block}
#brw{display:none;align-items:center;gap:10px;margin-bottom:16px;font-size:13px}#shade.ex #brw{display:flex}
#brw input{flex:1;width:auto}
.pl{display:grid;place-items:center;height:22px;cursor:pointer;margin-top:6px}.pl i{width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.7)}
#nl{padding:12px 14px 0;overflow:auto}
.nc{background:var(--app);color:var(--appink);border-radius:16px;padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.35}.nc small{opacity:.65;display:block;margin-bottom:3px}.nc b{display:block;font-size:14px}
.mn{display:flex;justify-content:space-between;padding:6px 20px;font-size:13px;color:#fff}.mn b{font-weight:600;cursor:pointer}
#rec{position:absolute;inset:0;z-index:25;background:rgba(10,12,14,.55);backdrop-filter:blur(6px);padding:60px 0 64px;display:none;flex-direction:column}
#rec.open{display:flex}
.cards{flex:1;display:flex;gap:16px;overflow-x:auto;padding:0 80px;align-items:center;scroll-snap-type:x mandatory;scrollbar-width:none}
.cw{flex:0 0 230px;scroll-snap-align:center;touch-action:pan-x;cursor:grab}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:700}
.ch i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.card{height:380px;background:var(--app);color:var(--appink);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.card u{display:block;height:10px;border-radius:5px;background:var(--line)}.card u:nth-child(3n){width:60%}.card u:nth-child(4n){width:80%}
.chip{display:block;margin:0 auto;background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:18px;padding:9px 20px;cursor:pointer}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:90}
.dlg{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:80}
.dlg>div{width:290px;background:var(--app);color:var(--appink);border-radius:28px;padding:22px 22px 14px}
.dlg h3{font-size:19px;margin-bottom:10px}.dlg p{font-size:14px;line-height:1.45;opacity:.85}
.dlg .a{display:flex;justify-content:flex-end;gap:6px;margin-top:16px}.dlg .a button{background:none;border:0;color:var(--accent);font-weight:700;padding:8px 12px;cursor:pointer}
canvas{display:block;border-radius:16px;border:1px solid var(--line);max-width:100%;touch-action:none}
.todo li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);list-style:none}
.todo li.d span{text-decoration:line-through;opacity:.5}.todo li span{flex:1}
.bd{display:grid;gap:8px;margin:10px auto;max-width:300px}
.bd button{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:transparent;color:inherit;font-size:30px;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes cin{from{opacity:0;transform:translateX(50px) scale(.92)}to{opacity:1;transform:none}}
.home.enter .ic{animation:up calc(.45s*var(--spd,1)) calc(var(--i,0)*35ms*var(--spd,1)) both}
.dlg>div{animation:pop calc(.2s*var(--spd,1)) both}
#rec.enter .cw{animation:cin calc(.35s*var(--spd,1)) both}
.tile,.btn,.nav button svg{transition:transform calc(.12s*var(--spd,1)),background calc(.2s*var(--spd,1))}
.tile:active,.btn:active{transform:scale(.92)}.nav button:active svg{transform:scale(.75)}
.nav{transition:color calc(.2s*var(--spd,1))}
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.srow i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;font-size:18px}
.srow small{display:block;opacity:.6;font-size:12px}.srow div{flex:1}
.pad3{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:14px}
.pad3 button{height:52px;border-radius:16px;border:1px solid var(--line);background:transparent;color:inherit;font-size:18px;cursor:pointer}
#pad.pat #pk{display:none}#pad:not(.pat) #pt{display:none}
canvas.pc{border:0;border-radius:0;width:240px;height:240px;margin:0 auto}
@media (max-width:520px){.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){.win,.ic i,#lock,#shade{transition:none}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="status"><span id="st">--:--</span><span id="si"></span></div>
  <div class="home">
    <div class="clockbig" id="cb">--:--</div>
    <div class="datebig" id="db"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="pill"><b id="pg">Y</b><input id="hs" enterkeyhint="search"><span style="opacity:.6;padding-right:8px">◉</span></div>
  <div class="dock dockw" id="dock"></div>
  <div id="rec"><div class="cards" id="cards"></div><button class="chip" id="clr">Tümünü temizle</button></div>
  <div id="shade">
    <div class="qp">
      <div class="qh"><span id="qd"></span><span>⏰ 07:30</span></div>
      <div id="brw">☀ <input type="range" id="br" min="30" max="100" value="100"></div>
      <div class="tiles" id="tiles"></div>
      <div class="pl" id="pl"><i></i></div>
    </div>
    <div id="nl"></div>
    <div class="mn"><span id="mg">Bildirimleri yönet</span><b id="ca">Tümünü temizle</b></div>
  </div>
  <nav class="nav" id="nav">
    <button id="back" aria-label="Geri"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M16 5 7 12l9 7z" fill="currentColor"/></svg></button>
    <button id="homebtn" aria-label="Ana ekran"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
    <button id="recbtn" aria-label="Son uygulamalar"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="5.5" y="5.5" width="13" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg></button>
  </nav>
  <div id="lock">
    <div class="t" id="lt">--:--</div><div class="d" id="ld"></div><div class="o">Webdroid telefonu</div>

    <button id="fp" aria-label="Parmak izi"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 4a8 8 0 0 0-8 8M12 8a4 4 0 0 0-4 4v3M12 4a8 8 0 0 1 8 8v2M12 8a4 4 0 0 1 4 4v1M12 12v6M8 19c1 1 2 1.5 4 1.5"/></svg></button>
    <div id="pad"><div id="pd"></div><div id="pk"></div><div id="pt"></div><button class="chip" id="pc">İptal</button></div>
  </div>
  <div id="dim"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},phone=$("phone"),nav=$("nav");
function ld(k,d){try{var v=localStorage.getItem("wd-"+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem("wd-"+k,JSON.stringify(v))}catch(e){}}
var DEFGL={clock:"thin",lnotif:true,cols:3,tshape:"c",order:"n",hcols:4,labels:true,isz:"m"};
var DEF={dark:false,acc:"#0f8b8d",wp:0,shape:"sq2",nav:"3",br:100,inst:[],se:"yandex",bm:"app",pin:"",lw:"same",pat:"",an:1,h24:true,pct:true,ip:"flat"};
var S=Object.assign({},DEF,ld("s",{}));S.gl=Object.assign({},DEFGL,S.gl||{});
var WP=[["#1b3a4b","#e08e6b"],["#2d1e3f","#d95d8a"],["#12372a","#9bc53d"],["#222831","#5c6b73"]];
var SE={yandex:["Yandex","https://yandex.com.tr/search/?text=","Y","#fc3f1d"],google:["Google","https://www.google.com/search?q=","G","#4285f4"],ddg:["DuckDuckGo","https://duckduckgo.com/?q=","D","#de5833"],bing:["Bing","https://www.bing.com/search?q=","B","#008373"]};
var P={browser:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',yt:'<path d="M3 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z"/><path d="M10 9l5 3-5 3z" fill="#fff"/>',store:'<path d="M6 4l13 8-13 8z" fill="#fff"/>',notes:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',calc:'<path d="M5 3h14v18H5z"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',snake:'<path d="M4 17c4-9 6 4 10-2 2-3 3-5 6-7"/><circle cx="20" cy="8" r="1" fill="#fff"/>',paint:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 1.5-2s0-2 1.5-2h2a3 3 0 0 0 3-3A9 9 0 0 0 12 3z"/><path d="M8 10h.01M12 7h.01M16 10h.01"/>',todo:'<path d="M5 12l4 4 10-10"/>',goodlock:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10M16 5v4M8 15v4"/>',xox:'<path d="M5 5l6 6M11 5l-6 6"/><circle cx="16" cy="16" r="3"/>',mem:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/>',fener:'<path d="M9 3h6l-1 6h-4zM10 9v8a2 2 0 0 0 4 0V9"/>',zar:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01"/>',sayac:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4M9 2h6"/>',lock:'<path d="M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3"/>'};
function svg(id,z){return'<svg viewBox="0 0 24 24" width="'+(z||26)+'" height="'+(z||26)+'" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+P[id]+'</svg>'}
var CORE=[{id:"browser",n:"Tarayıcı",c:"#3b82c4"},{id:"yt",n:"YouTube",c:"#d93a3a"},{id:"store",n:"Play Store",c:"#2e9d6b"},{id:"notes",n:"Notlar",c:"#e0a92e"},{id:"calc",n:"Hesap",c:"#0f8b8d"},{id:"clock",n:"Saat",c:"#e07a5f"},{id:"set",n:"Ayarlar",c:"#6c7a89"}];
var EXTRA=[{id:"goodlock",n:"Good Lock",c:"#5b5fc7",d:"Kilit ekranı, hızlı panel, gezinme ve ana ekranı özelleştir"},{id:"snake",n:"Yılan",c:"#7aa35c",d:"Klasik yılan oyunu"},{id:"xox",n:"XOX",c:"#c0563f",d:"İki kişilik XOX"},{id:"mem",n:"Hafıza",c:"#c9527a",d:"Eşleşen kartları bul"},{id:"paint",n:"Çizim",c:"#b0678c",d:"Parmağınla çiz"},{id:"todo",n:"Yapılacaklar",c:"#d08a3c",d:"Görev listesi"},{id:"fener",n:"Fener",c:"#8a8f98",d:"Ekranı fener olarak kullan"},{id:"zar",n:"Zar",c:"#3d7ea6",d:"Zar at, yazı tura at"},{id:"sayac",n:"Sayaç",c:"#7b6fb5",d:"Geri sayım sayacı"}];
var LOCKAPP={id:"lock",n:"Kilit",c:"#37474f",act:function(){lock()}};
