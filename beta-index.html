<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Webdroid APK Emulator</title>
  <style>
    :root {
      --bg: #dfe8ef;
      --phone-shell: #0d1117;
      --phone-body: #132b3d;
      --glass: rgba(255, 255, 255, 0.16);
      --text: #f6f7fb;
      --muted: #b3c0d4;
      --panel: rgba(7, 10, 14, 0.48);
      --accent: #42a5f5;
      --green: #4ade80;
      --amber: #fbbf24;
      --danger: #f87171;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, #f1f2f3, var(--bg));
      display: grid;
      place-items: center;
      color: var(--text);
    }

    body { padding: 24px; }

    .phone {
      position: relative;
      width: min(390px, 92vw);
      height: min(800px, 94vh);
      border-radius: 42px;
      background: linear-gradient(180deg, #16384f 0%, #0c1f2d 100%);
      box-shadow: 0 30px 65px rgba(0, 0, 0, 0.38), 0 0 0 10px var(--phone-shell);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      z-index: 40;
      background: rgba(4, 8, 12, 0.1);
    }

    .home-screen {
      position: absolute;
      inset: 0;
      padding: 62px 18px 92px;
      background: linear-gradient(180deg, rgba(20,38,52,0.9), rgba(26,36,43,0.92));
    }

    .clock {
      font-weight: 300;
      font-size: 62px;
      line-height: 1;
      letter-spacing: -2px;
      margin-left: 4px;
    }

    .date {
      margin: 10px 0 24px 4px;
      color: #ebf3ff;
      font-size: 14px;
      opacity: 0.9;
    }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px 8px;
    }

    .app-icon {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
      padding: 0;
      font: inherit;
    }

    .app-icon .glyph {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 10px 18px rgba(0,0,0,0.24);
    }

    .glyph.apk { background: linear-gradient(135deg, #2dd4bf, #14b8a6); }
    .glyph.browser { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .glyph.mail { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .glyph.camera { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
    .glyph.calc { background: linear-gradient(135deg, #fca5a5, #ef4444); }
    .glyph.gmap { background: linear-gradient(135deg, #86efac, #22c55e); }
    .glyph.music { background: linear-gradient(135deg, #f9a8d4, #ec4899); }
    .glyph.chat { background: linear-gradient(135deg, #c4b5fd, #8b5cf6); }

    .app-icon span {
      font-size: 11px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .search-bar {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 52px;
      height: 44px;
      border-radius: 22px;
      background: rgba(247, 247, 247, 0.9);
      display: flex;
      align-items: center;
      padding: 0 14px 0 12px;
      color: #2d2d2d;
      box-shadow: 0 2px 14px rgba(0,0,0,0.18);
    }

    .search-badge {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #ff6a3d;
      color: white;
      font-weight: 700;
      margin-right: 10px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: #222;
    }

    .search-circle {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(40,40,40,0.7);
      border-radius: 50%;
      position: relative;
      transform: scale(0.68);
    }

    .search-circle::after {
      content: "";
      position: absolute;
      width: 7px;
      height: 2px;
      background: rgba(40,40,40,0.7);
      border-radius: 2px;
      right: -5px;
      bottom: -1px;
      transform: rotate(45deg);
    }

    .dock {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 102px;
      height: 74px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      gap: 8px;
    }

    .dock .app-mini {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      border: 0;
      background: rgba(255,255,255,0.12);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3);
      cursor: pointer;
    }

    .dock .app-mini.apk { background: linear-gradient(135deg, #2dd4bf, #14b8a6); }
    .dock .app-mini.browser { background: linear-gradient(135deg, #60a5fa, #2563eb); }
    .dock .app-mini.chat { background: linear-gradient(135deg, #a78bfa, #7c3aed); }

    .window {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #f4f3f2;
      color: #1e2329;
      display: none;
      flex-direction: column;
      transform: translateY(18px);
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .window.active {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .window-header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px 0 14px;
      background: rgba(255,255,255,0.7);
      border-bottom: 1px solid rgba(18, 24, 31, 0.08);
      font-weight: 700;
    }

    .window-header .left,
    .window-header .right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .window-header button {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 0;
      background: rgba(15, 23, 42, 0.08);
      font-size: 18px;
      color: #1f2937;
      cursor: pointer;
    }

    .apk-panel {
      padding: 18px 16px 20px;
      background: linear-gradient(180deg, #eef5ff 0%, #f8f8f6 100%);
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .drop-zone {
      border: 2px dashed rgba(31, 95, 226, 0.45);
      background: rgba(59, 130, 246, 0.08);
      border-radius: 24px;
      min-height: 130px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #1f3c65;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
      padding: 16px;
    }

    .drop-zone:active { transform: scale(0.98); }

    .drop-zone small {
      display: block;
      margin-top: 6px;
      color: #486383;
      font-weight: 500;
    }

    .apk-meta {
      background: rgba(17, 24, 39, 0.04);
      border-radius: 18px;
      padding: 12px 14px;
      display: grid;
      gap: 8px;
    }

    .apk-meta strong {
      font-size: 18px;
    }

    .apk-meta .pill-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(59,130,246,0.12);
      color: #234a8a;
    }

    .pill.green { background: rgba(34,197,94,0.12); color: #166534; }
    .pill.amber { background: rgba(251,191,36,0.12); color: #8a5f00; }

    .run-btn {
      margin-top: auto;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 16px 18px rgba(37,99,235,0.24);
    }

    .emulator-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #f5f5f4 0%, #ece8e3 100%);
      overflow: hidden;
    }

    .emulator-toolbar {
      background: rgba(255,255,255,0.66);
      padding: 10px 12px;
      border-bottom: 1px solid rgba(17,24,39,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #303845;
    }

    .simulated-app {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow: auto;
    }

    .app-card {
      border-radius: 22px;
      background: linear-gradient(180deg, #ffffff, #f0f4f8);
      box-shadow: 0 14px 22px rgba(15, 25, 36, 0.12);
      padding: 18px 16px;
      text-align: center;
    }

    .app-icon-large {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #4ade80, #16a34a);
      box-shadow: 0 18px 22px rgba(34,197,94,0.28);
    }

    .app-card h3 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .app-card p {
      margin: 0 0 14px;
      color: #596981;
      font-size: 14px;
      line-height: 1.45;
    }

    .fake-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .fake-actions button {
      border: 0;
      border-radius: 14px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .action-primary {
      background: #1d4ed8;
      color: white;
    }

    .action-secondary {
      background: #e5e7eb;
      color: #1f2937;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 10px 8px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(15,23,42,0.04);
    }

    .stat strong {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .stat span {
      font-size: 11px;
      color: #58657d;
    }

    .browser-shell,
    .calc-shell,
    .notes-shell,
    .chat-shell {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 18px rgba(15,23,42,0.08);
      overflow: hidden;
      border: 1px solid rgba(17,24,39,0.06);
      display: flex;
      flex-direction: column;
      min-height: 380px;
    }

    .browser-header,
    .calc-header,
    .notes-header,
    .chat-header {
      background: #f4f6fb;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      color: #1f2c3a;
    }

    .browser-viewport {
      flex: 1;
      background: linear-gradient(180deg, #eaf1ff 0%, #f8f8f8 100%);
      position: relative;
      min-height: 320px;
    }

    .browser-viewport iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .calc-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      background: #f7f9fc;
      min-height: 330px;
    }

    .calc-screen {
      min-height: 72px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(15,23,42,0.08);
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px 14px;
      font-size: 28px;
      font-weight: 700;
      color: #192534;
      word-break: break-all;
      overflow: hidden;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .calc-grid button {
      border: 0;
      border-radius: 14px;
      padding: 14px 0;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      background: #e7ecf5;
      color: #1f2937;
    }

    .calc-grid .op {
      background: #dfe9ff;
      color: #1d4ed8;
    }

    .calc-grid .eq {
      background: #2563eb;
      color: white;
    }

    .notes-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 330px;
      background: linear-gradient(180deg, #fffefb 0%, #f5f7ff 100%);
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .note-item {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      color: #334155;
    }

    .note-item strong {
      display: block;
      margin-bottom: 2px;
      color: #0f172a;
    }

    .chat-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
      min-height: 330px;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
    }

    .chat-bubble {
      max-width: 75%;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .chat-bubble.incoming {
      background: #fff;
      border: 1px solid rgba(15,23,42,0.06);
      color: #1f2937;
      align-self: flex-start;
    }

    .chat-bubble.outgoing {
      background: #2563eb;
      color: white;
      align-self: flex-end;
    }

    .chat-input {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      border: 1px solid rgba(15,23,42,0.08);
      border-radius: 12px;
      background: white;
      padding: 10px 12px;
      outline: none;
      font: inherit;
    }

    .chat-input button {
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone" aria-label="phone emulator">
    <div class="status-bar">
      <span id="timeText">9:41</span>
      <span>5G • 100%</span>
    </div>

    <div class="home-screen" id="homeScreen">
      <div class="clock" id="clockText">9:41</div>
      <div class="date" id="dateText">Tuesday, October 29</div>

      <div class="launcher-grid">
        <button class="app-icon" data-target="apk-window">
          <div class="glyph apk">A</div>
          <span>APK</span>
        </button>
        <button class="app-icon" data-target="browser-window">
          <div class="glyph browser">B</div>
          <span>Browser</span>
        </button>
        <button class="app-icon" data-target="mail-window">
          <div class="glyph mail">M</div>
          <span>Mail</span>
        </button>
        <button class="app-icon" data-target="camera-window">
          <div class="glyph camera">C</div>
          <span>Camera</span>
        </button>
        <button class="app-icon" data-target="calc-window">
          <div class="glyph calc">Σ</div>
          <span>Calc</span>
        </button>
        <button class="app-icon" data-target="map-window">
          <div class="glyph gmap">G</div>
          <span>Maps</span>
        </button>
        <button class="app-icon" data-target="music-window">
          <div class="glyph music">♫</div>
          <span>Music</span>
        </button>
        <button class="app-icon" data-target="chat-window">
          <div class="glyph chat">💬</div>
          <span>Chat</span>
        </button>
      </div>
    </div>

    <div class="search-bar">
      <div class="search-badge">Y</div>
      <input class="search-input" value="Search" aria-label="Search" />
      <div class="search-circle" aria-hidden="true"></div>
    </div>

    <div class="dock" aria-label="dock apps">
      <button class="app-mini apk" data-target="apk-window" title="APK" type="button">A</button>
      <button class="app-mini browser" data-target="browser-window" title="Browser" type="button">B</button>
      <button class="app-mini chat" data-target="chat-window" title="Chat" type="button">💬</button>
    </div>

    <div id="apk-window" class="window active" aria-label="APK window">
      <div class="window-header">
        <div class="left">
          <button type="button" class="window-back" aria-label="Back">←</button>
          <span>APK Emulator</span>
        </div>
        <div class="right">
          <button type="button" aria-label="Info">⋯</button>
        </div>
      </div>

      <div class="apk-panel">
        <label class="drop-zone" for="apk-file-input">
          <div>
            <div style="font-size: 30px;">⬆</div>
            <div>Choose APK</div>
            <small>.apk files only</small>
          </div>
        </label>
        <input id="apk-file-input" type="file" accept=".apk" style="display:none" />

        <div class="apk-meta">
          <strong id="apk-name">No APK loaded</strong>
          <div class="pill-row">
            <span class="pill amber" id="apk-status">Pending</span>
            <span class="pill" id="apk-arch">Android 9</span>
          </div>
        </div>

        <button type="button" class="run-btn" id="run-apk">Run emulated APK</button>
      </div>
    </div>

    <div id="emulator-window" class="window" aria-label="APK running emulator">
      <div class="window-header">
        <div class="left">
          <button type="button" class="window-back" aria-label="Back">←</button>
          <span id="emulator-title">Demo App</span>
        </div>
        <div class="right">
          <button type="button" aria-label="Menu">⋮</button>
        </div>
      </div>

      <div class="emulator-screen">
        <div class="emulator-toolbar">
          <span>Webdroid</span>
          <span id="emulator-time">9:41</span>
        </div>

        <div class="simulated-app" id="simulated-app"></div>
      </div>
    </div>
  </div>

  <script>
    const statusClock = document.getElementById('timeText');
    const homeClock = document.getElementById('clockText');
    const dateText = document.getElementById('dateText');
    const emulatorTime = document.getElementById('emulator-time');
    const apkFileInput = document.getElementById('apk-file-input');
    const apkNameLabel = document.getElementById('apk-name');
    const apkStatus = document.getElementById('apk-status');
    const apkArch = document.getElementById('apk-arch');
    const runApkButton = document.getElementById('run-apk');
    const apkWindow = document.getElementById('apk-window');
    const emulatorWindow = document.getElementById('emulator-window');
    const simulatedApp = document.getElementById('simulated-app');
    const emulatorTitle = document.getElementById('emulator-title');

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: false });
      const date = now.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

      statusClock.textContent = time;
      homeClock.textContent = time;
      emulatorTime.textContent = time;
      dateText.textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000 * 30);

    function showWindow(targetId) {
      [apkWindow, emulatorWindow].forEach((w) => {
        w.classList.remove('active');
      });
      const selected = document.getElementById(targetId);
      if (selected) selected.classList.add('active');
    }

    document.querySelectorAll('[data-target]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.getAttribute('data-target');
        if (target === 'apk-window') showWindow('apk-window');
        if (target === 'browser-window') {
          showWindow('emulator-window');
          loadApp('browser');
        }
        if (target === 'chat-window') {
          showWindow('emulator-window');
          loadApp('chat');
        }
      });
    });

    document.querySelectorAll('.window-back').forEach((button) => {
      button.addEventListener('click', () => showWindow('apk-window'));
    });

    function cleanName(fileName) {
      return (fileName || 'Demo App')
        .replace(/\.apk$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function detectAppType(fileName, fallbackName = '') {
      const haystack = `${fileName} ${fallbackName}`.toLowerCase();
      if (/(calc|calculator|math|finance)/.test(haystack)) return 'calculator';
      if (/(note|memo|todo|tasks|keep)/.test(haystack)) return 'notes';
      if (/(browser|web|google|search|chrome)/.test(haystack)) return 'browser';
      if (/(chat|messenger|sms|message)/.test(haystack)) return 'chat';
      return 'demo';
    }

    function renderCalculator() {
      const ui = `
        <div class="calc-shell">
          <div class="calc-header"><span>Calculator</span><span>⌂</span></div>
          <div class="calc-body">
            <div class="calc-screen" id="calc-output">0</div>
            <div class="calc-grid">
              <button type="button">C</button>
              <button type="button">⌫</button>
              <button type="button" class="op">÷</button>
              <button type="button" class="op">×</button>
              <button type="button">7</button>
              <button type="button">8</button>
              <button type="button">9</button>
              <button type="button" class="op">−</button>
              <button type="button">4</button>
              <button type="button">5</button>
              <button type="button">6</button>
              <button type="button" class="op">+</button>
              <button type="button">1</button>
              <button type="button">2</button>
              <button type="button">3</button>
              <button type="button" class="eq" rowspan="2">=</button>
              <button type="button" style="grid-column: span 2;">0</button>
              <button type="button">.</button>
            </div>
          </div>
        </div>
      `;

      simulatedApp.innerHTML = ui;
      const calcOutput = document.getElementById('calc-output');
      let expression = '0';

      document.querySelectorAll('.calc-grid button').forEach((btn) => {
        btn.addEventListener('click', () => {
          const value = btn.textContent.trim();

          if (value === 'C') {
            expression = '0';
          } else if (value === '⌫') {
            expression = expression.length > 1 ? expression.slice(0, -1) : '0';
          } else if (value === '=') {
            try {
              const computed = Function(`"use strict"; return (${expression.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')})`)();
              expression = Number.isFinite(computed) ? String(computed) : 'Error';
            } catch {
              expression = 'Error';
            }
          } else if (['+', '-', '×', '÷'].includes(value)) {
            const last = expression.slice(-1);
            if (['+', '-', '×', '÷'].includes(last)) expression = expression.slice(0, -1) + value;
            else expression = expression === '0' ? value : expression + value;
          } else if (value === '.') {
            const parts = expression.split(/[+\-×÷]/);
            const last = parts[parts.length - 1];
            if (!last.includes('.')) expression = expression === '0' ? '0.' : expression + '.';
          } else {
            expression = expression === '0' ? value : expression + value;
          }

          calcOutput.textContent = expression;
        });
      });
    }

    function renderNotes() {
      simulatedApp.innerHTML = `
        <div class="notes-shell">
          <div class="notes-header"><span>Notes</span><span>✎</span></div>
          <div class="notes-body">
            <div class="notes-list">
              <div class="note-item"><strong>Ideas</strong>Try to add built-in APK emulation to the phone shell.</div>
              <div class="note-item"><strong>Checklist</strong>Upload APK, detect app type, launch real app mock window.</div>
              <div class="note-item"><strong>Launch</strong>Boot simulation is now active inside beta-index.html.</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderBrowser() {
      simulatedApp.innerHTML = `
        <div class="browser-shell">
          <div class="browser-header"><span>Browser</span><span>🔒</span></div>
          <div class="browser-viewport">
            <iframe title="emulated web browser" src="https://example.com"></iframe>
          </div>
        </div>
      `;
    }

    function renderChat() {
      simulatedApp.innerHTML = `
        <div class="chat-shell">
          <div class="chat-header"><span>Messages</span><span>•</span></div>
          <div class="chat-body">
            <div class="chat-bubble incoming">Hey! Your APK just booted in the emulator.</div>
            <div class="chat-bubble outgoing">Nice! The app is launching correctly.</div>
            <div class="chat-bubble incoming">This is running inside the same beta-index.html page.</div>
            <div class="chat-input">
              <input type="text" value="Hello" aria-label="chat input" />
              <button type="button">Send</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderDemoApp(title, iconLetter) {
      simulatedApp.innerHTML = `
        <div class="app-card">
          <div class="app-icon-large" style="background: linear-gradient(135deg, #60a5fa, #2563eb);">${iconLetter}</div>
          <h3>${title}</h3>
          <p>Running inside the browser-based Android emulator.</p>
          <div class="fake-actions">
            <button class="action-primary" type="button">Open</button>
            <button class="action-secondary" type="button">Install</button>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><strong>12.4</strong><span>FPS</span></div>
          <div class="stat"><strong>96%</strong><span>CPU</span></div>
          <div class="stat"><strong>3.2GB</strong><span>RAM</span></div>
        </div>
      `;
    }

    function loadApp(type = 'demo', titleOverride = '') {
      const typeKey = type || 'demo';
      const title = titleOverride || (typeKey === 'browser' ? 'Browser' : typeKey === 'calculator' ? 'Calculator' : typeKey === 'notes' ? 'Notes' : typeKey === 'chat' ? 'Messages' : 'Demo App');
      const icon = title.charAt(0).toUpperCase() || 'D';
      emulatorTitle.textContent = title;

      if (typeKey === 'calculator') renderCalculator();
      else if (typeKey === 'notes') renderNotes();
      else if (typeKey === 'browser') renderBrowser();
      else if (typeKey === 'chat') renderChat();
      else renderDemoApp(title, icon);
    }

    apkFileInput.addEventListener('change', (event) => {
      const [file] = event.target.files || [];
      if (!file) return;

      const fileName = file.name || 'custom.apk';
      const clean = cleanName(fileName);
      const inferredType = detectAppType(fileName, clean);

      apkNameLabel.textContent = fileName;
      apkStatus.textContent = 'Ready';
      apkStatus.className = 'pill green';
      apkArch.textContent = inferredType.charAt(0).toUpperCase() + inferredType.slice(1);
      runApkButton.dataset.appType = inferredType;
      runApkButton.dataset.appName = clean || 'Demo App';
    });

    runApkButton.addEventListener('click', () => {
      const appType = runApkButton.dataset.appType || detectAppType(apkNameLabel.textContent, '');
      const appName = runApkButton.dataset.appName || cleanName(apkNameLabel.textContent) || 'Demo App';

      apkStatus.textContent = 'Emulating';
      apkStatus.className = 'pill amber';
      showWindow('emulator-window');
      loadApp(appType, appName);
    });
  </script>
</body>
</html>
